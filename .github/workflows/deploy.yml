name: Deploy site to GitHub Pages

on:
    push:
        branches: [main]
    # Rebuild daily so the docs pick up new frontend-foundation commits.
    schedule:
        - cron: '0 3 * * *'
    # Lets frontend-foundation trigger a rebuild (needs a token there).
    repository_dispatch:
        types: [foundation-updated]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            # prebuild clones frontend-foundation (main), then generates the
            # component pages before `next build` exports to ./out.
            - run: npm run build
            - run: touch out/.nojekyll
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: out

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@v4
              id: deployment
